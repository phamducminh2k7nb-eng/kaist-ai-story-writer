name: Import KAIST Story Autopilot v4

on:
  push:
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-* > /tmp/kaist.b64
          base64 -d /tmp/kaist.b64 > /tmp/kaist.zip
          rm -rf /tmp/kaist_extract
          mkdir -p /tmp/kaist_extract
          unzip -q /tmp/kaist.zip -d /tmp/kaist_extract
          test -f /tmp/kaist_extract/kaist_work/package.json

          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.github'             ! -name '.upload'             -exec rm -rf {} +

          cp -a /tmp/kaist_extract/kaist_work/. .
          rm -rf .upload
          rm -f .github/workflows/import-kaist-v4.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import KAIST Story Autopilot v4"
          git push origin HEAD:main
